<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Personal website of Matúš Adamkovič, researcher in research credibility, meta-science, measurement, and network approaches to psychological phenomena."
    >
    <title>Matúš Adamkovič</title>
    <link rel="icon" href="assets/profile.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="home">
    <header class="site-header">
      <a class="wordmark" href="index.html" data-field="name">Matúš Adamkovič</a>
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Overview</a>
        <a href="research.html">Research</a>
        <a href="projects.html">Projects</a>
        <a href="publications.html">Publications</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <p class="kicker" data-field="role">Researcher · Meta-science · Measurement</p>
          <h1 id="intro-title" data-field="name">Matúš Adamkovič</h1>
          <p class="lead" data-field="bio"></p>
          <div class="actions" data-profile-links></div>
        </div>
        <figure class="portrait">
          <img src="assets/profile.png" alt="Portrait of Matúš Adamkovič">
        </figure>
      </section>

      <section class="section-grid" aria-labelledby="overview-title">
        <div>
          <p class="section-label">Overview</p>
          <h2 id="overview-title" data-field="overviewTitle">Overview & research</h2>
        </div>
        <div class="text-block">
          <p data-field="overviewIntro"></p>
          <ul class="plain-list" data-overview-highlights></ul>
        </div>
      </section>

      <section class="section-grid" aria-labelledby="overview-projects-title">
        <div>
          <p class="section-label">Overview</p>
          <h2 id="overview-projects-title">Selected projects</h2>
        </div>
        <div>
          <div class="list" data-overview-projects></div>
          <p class="section-link"><a href="projects.html">All projects</a></p>
        </div>
      </section>

      <section class="section-grid" aria-labelledby="overview-publications-title">
        <div>
          <p class="section-label">Overview</p>
          <h2 id="overview-publications-title">Selected publications</h2>
        </div>
        <div>
          <p class="text-block" data-field="score"></p>
          <div class="list" data-overview-publications></div>
          <p class="section-link"><a href="publications.html">All publications</a></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-footer></span>
    </footer>

    <script src="content/site-content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
